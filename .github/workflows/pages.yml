name: Breakout Scanner (GitHub Pages)

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, after the US close (UTC)
  workflow_dispatch: {}        # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["pages_app/**", ".github/workflows/pages.yml", "scanner.py", "stock_universe.py"]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # commit refreshed data back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pages_app/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pages_app/web/package-lock.json

      - name: Install Python dependencies
        run: pip install -r pages_app/requirements.txt

      - name: Test
        run: python -m pytest -q tests/test_scanner.py tests/test_generate.py

      # Only the scheduled / manual runs hit Yahoo Finance. A plain push to main
      # just rebuilds the site from the data already committed to the repo.
      - name: Scan all indices
        if: github.event_name != 'push'
        run: python pages_app/generate.py --out pages_app/web/public/data

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages_app/web/public/data
          git diff --cached --quiet || git commit -m "Refresh scan data [skip ci]"
          git push

      - name: Build UI
        working-directory: pages_app/web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages_app/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
